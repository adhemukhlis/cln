name: Build

# Runs when a PR is merged into main. Produces snapshot binaries for every
# target as workflow artifacts; publishing a release still requires a v* tag.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No go.sum while the module has no dependencies; key the cache on go.mod.
          cache-dependency-path: go.mod

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cln-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
