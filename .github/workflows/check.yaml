name: Check

# Runs only on PRs into main. PRs into development (work branches) run no CI.
# Only development may open a PR into main; enforced by the source-branch job.
# `validate` is the single required status check in main's ruleset: it passes
# only when every other job succeeded, so jobs can be added here without
# touching the ruleset, and skipped/cancelled jobs can never slip through.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Only development may merge into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "development" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must come from development (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi

  lint:
    needs: source-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    needs: source-branch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  goreleaser-check:
    needs: source-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  validate:
    name: validate
    if: always()
    needs: [source-branch, lint, test, goreleaser-check]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Not all checks succeeded."
              exit 1
            fi
          done
